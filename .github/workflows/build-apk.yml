name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Production Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Ensure Keystore Exists
        run: |
          if [ ! -f android/app/release.p12 ]; then
            echo "Generating production release keystore..."
            keytool -genkeypair -v -keystore android/app/release.p12 -storetype PKCS12 -alias playmusic -keyalg RSA -keysize 2048 -validity 10000 -storepass "playmusic123" -keypass "playmusic123" -dname "CN=PlayMusic, OU=Kheireditz, O=Kheireditz, L=Jakarta, ST=Jakarta, C=ID"
          fi
          ls -la android/app/release.p12

      - name: Build Release APK with Gradle
        run: |
          cd android
          gradle assembleRelease --no-daemon --stacktrace

      - name: Prepare APK Release Artifacts
        run: |
          mkdir -p release-output
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: Release APK not found!"
            exit 1
          fi
          echo "Found APK at $APK_PATH"
          cp "$APK_PATH" release-output/playmusic-release.apk
          cp "$APK_PATH" release-output/playmusic-v2.5.0.apk
          cd release-output
          sha256sum playmusic-release.apk > playmusic-release.apk.sha256
          ls -lh

      - name: Upload APK Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: playmusic-v2.5.0-production-apk
          path: release-output/*

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v2.5.0
          name: "Play Music v2.5.0 (Real Native Android APK)"
          body: |
            ### 🎵 Play Music v2.5.0 — Real Native Android APK (Production)
            
            Rilis resmi **Real Native Android APK** untuk Play Music. Dibangun 100% menggunakan arsitektur native Android Views, Foreground MediaService, MediaSession lock screen controls, Neumorphic Curved Dock dengan raised center feature, mini player close button, search history, comprehensive settings, dan native DownloadManager (bukan WebView wrapper).
            
            Aplikasi ditandatangani dengan keystore produksi tetap (*persistent release signature*), sehingga pembaruan versi mendatang dapat langsung dipasang tanpa perlu uninstal aplikasi sebelumnya.
            
            #### 🌟 Pembaruan & Fitur Unggulan v2.5.0:
            - **100% Real Native Android APK**: Zero WebView, performa mulus 60fps dengan RecyclerView native dan custom tactile drawables.
            - **Curved Bottom Dock & Raised Center Feature**: Dock navigasi bawah dengan sudut lengkung elegan dan tombol tengah floating yang naik ke atas sedikit untuk akses instan Now Playing / Quick Vibe.
            - **Tombol Tutup (X) Mini Player**: Mini player di bagian bawah kini dilengkapi tombol 'X' untuk menutup/menghentikan pemutar mini kapanpun dibutuhkan.
            - **Riwayat Pencarian (Search History)**: Riwayat pencarian interaktif di bawah kolom pencarian lengkap dengan tombol hapus satuan dan tombol hapus semua, serta chip tren populer.
            - **Pengaturan APK Lengkap & Mewah**: Pengaturan komprehensif untuk bitrate (320kbps Hi-Fi, 256kbps, 128kbps, saver), preset equalizer, sleep timer otomatis, pembersihan cache memori, dan pembaruan in-place.
            - **Tactile Shimmer Skeleton Loading State**: Loading state modern dengan placeholder kartu berdenyut tactile saat memuat lagu dan pencarian.
            - **Lirik Karaoke Real-Time & Audio 320 kbps**: Sinkronisasi lirik per baris/detik di modal pemutar penuh.
            
            #### 📥 Cara Pasang / Update:
            1. Unduh file **`playmusic-release.apk`** di bawah ini.
            2. Buka file APK di HP Android Anda, lalu pilih **Install** (atau **Update** jika sudah terpasang).
            3. Aplikasi siap digunakan!
          files: |
            release-output/playmusic-release.apk
            release-output/playmusic-v2.5.0.apk
            release-output/playmusic-release.apk.sha256
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
