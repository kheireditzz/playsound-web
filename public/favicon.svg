<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Crisp vibrant Deep Teal gradient (Primary brand #006666) -->
    <linearGradient id="brandTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#008080"/>
      <stop offset="50%" stop-color="#006666"/>
      <stop offset="100%" stop-color="#004D4D"/>
    </linearGradient>
  </defs>

  <!-- Clean squircle badge without any blur or drop shadows -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#brandTeal)"/>
  <!-- Crisp high-precision hairline border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.5"/>

  <!-- Centered high-contrast music note (Clean, bold & recognizable at 16px) -->
  <g transform="translate(32, 32) scale(2.2) translate(-12, -12)">
    <path d="M9 18V5l12-2v13" fill="none" stroke="#FFFFFF" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="6" cy="18" r="3.2" fill="#FFFFFF"/>
    <circle cx="18" cy="16" r="3.2" fill="#FFFFFF"/>
  </g>
</svg>
